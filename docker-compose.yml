# The Target Environment, standalone.
#
# `docker compose up` here brings up a working target environment on its own:
# the service, the feature-flag provider it reads its flag from, and that
# provider's database. Nothing in this file mentions Argus, and nothing in it
# needs Argus to be running - Argus reaches this environment over HTTP the same
# way it would reach a real one, and the environment neither knows nor cares.

# What puts a container on the stack's clock: libfaketime, preloaded, reading the
# offset `sim-clock` writes. Only the wall clock moves - monotonic time is left
# real, so every timer, timeout and sleep inside the container lasts what it
# always did. Every image links the library to one path, so all preload that.
x-on-the-stacks-clock: &on-the-stacks-clock
  FAKETIME_TIMESTAMP_FILE: /clock/spec
  # Read on every call, not cached for the default ten seconds: the offset grows
  # by `speed - 1` seconds every real second, and a cached one would put this
  # container that far behind everybody else.
  FAKETIME_NO_CACHE: "1"
  FAKETIME_DONT_FAKE_MONOTONIC: "1"
  LD_PRELOAD: /usr/local/lib/libfaketime.so.1

services:
  # The stack's clock: simulated time is SIM_CLOCK_EPOCH + (real - EPOCH) *
  # SIM_CLOCK_SPEED, the formula every process that reads it agrees on. This
  # writes the offset that puts real time there into a spec file every 100ms,
  # on a volume every faked service reads.
  #
  # One shared offset rather than libfaketime's own speed factor, which anchors
  # to each process's start: measured, containers started a few seconds apart
  # then disagreed by tens of simulated seconds. Unset, the offset is zero and
  # every container reads the real clock.
  sim-clock:
    image: python:3.14-slim
    environment:
      SIM_CLOCK_EPOCH: "${SIM_CLOCK_EPOCH:-0}"
      SIM_CLOCK_SPEED: "${SIM_CLOCK_SPEED:-1}"
    volumes:
      - sim-clock:/clock
    command:
      - python
      - -c
      - |
        import os, time
        epoch = float(os.environ["SIM_CLOCK_EPOCH"])
        speed = float(os.environ["SIM_CLOCK_SPEED"])
        while True:
            with open("/clock/spec.tmp", "w") as spec:
                print("+%.3f" % ((time.time() - epoch) * (speed - 1)), file=spec)
            os.replace("/clock/spec.tmp", "/clock/spec")
            time.sleep(0.1)
    healthcheck:
      # Healthy once the first offset is down, because a faked process that
      # starts before it finds no spec and runs on the real clock.
      test: ["CMD", "test", "-f", "/clock/spec"]
      interval: 1s
      retries: 30

  unleash-db:
    build:
      context: images/postgres-faketime
    # As `postgres` from the start: the image's entrypoint starts as root and
    # switches with `gosu`, and under libfaketime that switch hangs with no
    # output.
    user: postgres
    depends_on:
      sim-clock:
        condition: service_healthy
    volumes:
      - sim-clock:/clock:ro
    environment:
      <<: *on-the-stacks-clock
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
      POSTGRES_DB: unleash
    # Published so a test run can reset the provider between cases. Unleash's
    # event log is an audit log: its API is read-only, and deleting a flag
    # leaves the flag's history behind (and adds to it). A test that toggled a
    # flag therefore cannot undo that fact through any supported route, and
    # every later test in the run would see a change that was not its own.
    # Reaching the provider's own database is the only way back to a clean
    # world, which makes this port part of what the fixture is for.
    #
    # 5433 because Argus's own Postgres holds 5432.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash"]
      interval: 2s
      timeout: 2s
      retries: 15

  unleash:
    # Pinned rather than tracking `latest`, in `images/unleash-faketime`, which
    # adds only libfaketime to the vendor's image: the init-token environment
    # variables below have been renamed across versions, and a wrong one makes
    # the container refuse to start. The names, the admin paths and the
    # evaluation response shape were all verified against this exact tag -
    # re-verify on any bump.
    build:
      context: images/unleash-faketime
    depends_on:
      unleash-db:
        condition: service_healthy
    volumes:
      - sim-clock:/clock:ro
    environment:
      <<: *on-the-stacks-clock
      DATABASE_URL: "postgres://unleash:unleash@unleash-db:5432/unleash"
      DATABASE_SSL: "false"
      LOG_LEVEL: "warn"
      # Applied on first startup only - changing these means bringing the
      # provider's volume down with `-v`.
      UNLEASH_DEFAULT_ADMIN_USERNAME: "argus"
      UNLEASH_DEFAULT_ADMIN_PASSWORD: "argus"
      # Seeded so the stack is usable with nobody logging into the console
      # first. Insecure by design and safe by scope: reachable only from this
      # network and a local port, holding nothing but a demo flag.
      #
      # The admin token is the write credential - it is what toggles a flag.
      # The frontend token can only evaluate.
      INIT_ADMIN_API_TOKENS: "*:*.argus-demo-admin-token"
      # Scoped to production, the one environment the Target Service keeps -
      # a token is bound to its environment, so this has to move with
      # `UNLEASH_ENVIRONMENT` below. These are created on first startup only:
      # changing one means `docker compose down -v` for the provider's volume.
      INIT_FRONTEND_API_TOKENS: "default:production.argus-demo-frontend-token"
    ports:
      # Published so the flag can be watched, and changed, in Unleash's own
      # console during a demo.
      - "4242:4242"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:4242/health || exit 1"]
      interval: 2s
      timeout: 10s
      retries: 30
      start_period: 5s

  # Argus writes flags under its own name rather than the shop's. Both are admin
  # credentials, and this provider records an event's author as the *username on
  # the token that made it* - so a single shared token makes Argus's own revert
  # indistinguishable from a human's, and an agent that re-reads what recently
  # changed finds its own action sitting there as a candidate cause.
  #
  # Through psql because the admin API will not create an admin token on this
  # version: `POST /api/admin/api-tokens` accepts only client, backend and
  # frontend types. The row is honoured immediately, with no restart.
  #
  # The username here is the string Argus filters its own changes by, and Argus
  # holds that string separately - `UNLEASH_ACTOR` in its own repo. The two are
  # compared exactly, so they move together or not at all.
  argus-token-seed:
    image: postgres:16
    depends_on:
      unleash:
        condition: service_healthy
    environment:
      PGPASSWORD: "unleash"
    command: >
      psql -h unleash-db -U unleash -d unleash -v ON_ERROR_STOP=1
      -c "INSERT INTO api_tokens (secret, username, type, token_name)
           VALUES ('*:*.argus-agent-token', 'Argus', 'admin', 'Argus')
           ON CONFLICT (secret) DO NOTHING"
    restart: "no"

  # Seeds the fallback flag already switched on, which is where the shop's story
  # says it has sat for months.
  #
  # Through psql, and that is the point rather than a convenience. This
  # provider's event log is an audit log: switching a flag on through its API
  # records `feature-environment-enabled`, and that is precisely the event an
  # agent reads when it asks what changed recently. A flag that had to be
  # switched on at startup would therefore arrive carrying a fresh change of its
  # own, contradicting the one thing every scenario using it asserts - that
  # nobody has touched it. Writing the row directly records nothing.
  #
  # It also makes the incident honest at the other end. This provider does not
  # record a toggle that changes nothing, so a scenario putting the flag into
  # its healthy state before breaking it now writes no event at all, and the
  # only fallback change in the log is the one that staged the incident.
  #
  # `production` is the environment the Target Service keeps, and it exists in a
  # new project by default - so this moves with `UNLEASH_ENVIRONMENT` below.
  fallback-flag-seed:
    image: postgres:16
    depends_on:
      unleash:
        condition: service_healthy
    environment:
      PGPASSWORD: "unleash"
    command: >
      psql -h unleash-db -U unleash -d unleash -v ON_ERROR_STOP=1
      -c "INSERT INTO features (name, description, type, project)
           VALUES ('legacy-checkout-fallback',
                   'Keeps account pages on the old, safe renderer - on for months, and the shop''s fault is exposed when it is withdrawn',
                   'release', 'default')
           ON CONFLICT (name) DO NOTHING"
      -c "INSERT INTO feature_environments (environment, feature_name, enabled)
           VALUES ('production', 'legacy-checkout-fallback', true)
           ON CONFLICT (environment, feature_name) DO NOTHING"
    restart: "no"

  # The rendered-summary cache the account page reads before it works a
  # shopper's spend figure out.
  #
  # Until one scenario needed what a cache *holds* rather than how fast it
  # answers, there was nothing here: the cache was arithmetic in the generator
  # and `deploy/values-production.yaml` named an address nothing ever dialled.
  # One scenario now speaks the real protocol to this container, and every other
  # scenario's cache stays computed - so no window, recording or graded fix
  # moves.
  cache:
    image: redis:7-alpine
    networks:
      default:
        aliases:
          # The hostname the deployment names, resolving for the first time.
          # `values-production.yaml` was written as a cluster's configuration
          # would be, with a Kubernetes service's FQDN, and that stays untouched
          # - the deployed address and the port a healthy shop dials differ by
          # one digit on purpose, which is what `cache-misconfigured` stages. An
          # alias makes the fiction real without editing the fact.
          - cache.io-shop.svc.cluster.local
    ports:
      # Published because what discards an entry runs on the host rather than in
      # this network, and reaches the cache the same way it reaches anything
      # else: over a port, by an address it was configured with. 6379 is the
      # port a working shop dials (`settings.LAST_KNOWN_GOOD_CACHE_PORT`), and
      # the deployed 6380 is nowhere - a shop pointed at it is refused, which is
      # the whole of that scenario's fault.
      - "6379:6379"
    # No volume, and that is the choice rather than an omission. Every other
    # stateful service here keeps one so its data belongs to the compose project;
    # a cache is the one store whose contents must *not* outlive the run that
    # staged them. An entry surviving into the next run is a stale figure nobody
    # staged, found by the integrity check, and reported as an incident of its
    # own.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  target-service:
    build:
      context: .
    depends_on:
      # The service evaluates its flag on every read and bootstraps the flag at
      # startup, so it has nothing to serve until the provider is up. Its
      # bootstrap retries as well - this only spares it the retries in the
      # common case.
      unleash:
        condition: service_healthy
      # Not because the shop needs Argus's credential - it never uses it - but
      # because a one-shot that merely exists is a container `docker compose up
      # --wait` sees exit and calls a failed startup. Declared as a completion
      # this service waits on, it becomes a step in bringing the environment up
      # rather than a container that died.
      argus-token-seed:
        condition: service_completed_successfully
      # So the flag is already resting on by the time this service looks. Left
      # to race, the shop would find it missing and switch it on itself, which
      # is the recorded toggle the seed exists to avoid.
      fallback-flag-seed:
        condition: service_completed_successfully
      # Not because the shop needs a cache - it recomputes when the cache holds
      # nothing or cannot be reached, and that fallback is load-bearing rather
      # than defensive. What must not race is the *staging*: seeding a scenario
      # writes entries, and a seed arriving before the cache accepts
      # connections would stage a shop with no stale figures in it and an alert
      # describing some.
      cache:
        condition: service_healthy
    volumes:
      - sim-clock:/clock:ro
    environment:
      <<: *on-the-stacks-clock
      UNLEASH_BASE_URL: "http://unleash:4242"
      UNLEASH_PROJECT: "default"
      UNLEASH_ENVIRONMENT: "production"
      UNLEASH_FLAG: "monthly-spend-feature"
      # The service holds the admin token because in this fixture it plays the
      # operator who toggled the flag on - `POST /scenario/seed` is the click
      # that started the incident.
      UNLEASH_ADMIN_TOKEN: "*:*.argus-demo-admin-token"
      UNLEASH_FRONTEND_TOKEN: "default:production.argus-demo-frontend-token"
      # The provider's own database, which a reset clears the flag history
      # in - see `target_app.history`. Unleash offers no way to do it
      # through the API, and a reset that left the last run's toggles in
      # the log would hand the next investigation suspects nobody staged.
      UNLEASH_DATABASE_URL: "postgresql://unleash:unleash@unleash-db:5432/unleash"
      # Where this service's monitoring posts the alerts it raises. Whatever
      # watches the shop runs on the host rather than in this network - from in
      # here, the host is `host.docker.internal`, not `localhost`. Nothing
      # depends on anything listening there: an alert nobody accepts is reported
      # as undelivered and the staged incident carries on regardless.
      MONITORING_ALERT_WEBHOOK_URL: "http://host.docker.internal:8000/webhooks/alerts"
      # Whether the Prometheus stand-in serves the minute still in progress: 0
      # does, as every push's run wants; the nightly passes 1, so the path a
      # real source produces - a minute reported once it is over - is walked too.
      PROMETHEUS_REPORTING_LAG_MINUTES: "${PROMETHEUS_REPORTING_LAG_MINUTES:-0}"
      # A second listener, on TLS, for clients that will not speak anything
      # else - PagerDuty's SDK refuses a base URL that is not `https://`. Same
      # process as the plain one, because everything this service knows about a
      # staged scenario lives in its memory. The certificate is self-signed and
      # minted at startup, so whatever reads this port is told not to verify
      # it; a deployed environment leaves this unset and gets one plain
      # listener behind the platform's own TLS.
      TLS_PORT: 8443
    extra_hosts:
      # Linux daemons do not resolve `host.docker.internal` on their own; Docker
      # Desktop does. Declaring it costs nothing where it is already there and
      # is what makes the line above work in CI.
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8000"
      - "8443:8443"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  # In memory: every faked process reads the spec on each call, so it lives
  # where reading it costs nothing - and a clock has no business outliving its
  # stack.
  sim-clock:
    driver_opts:
      type: tmpfs
      device: tmpfs
