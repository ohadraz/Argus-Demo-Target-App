[project]
name = "argus-demo-target-app"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    # Minting the throwaway TLS certificate the PagerDuty stand-in needs - see
    # `target_app.serve`.
    "cryptography>=43.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # Reading `deploy/values-production.yaml`, the deployment configuration the
    # shop is handed. Declared rather than leaned on: it arrives transitively
    # through uvicorn's extras today, and a direct import of a dependency
    # nobody asked for is one that disappears when an unrelated extra changes.
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/io_shop", "src/target_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
